name: CI/CD Pipeline of cbpl-solar-main-web

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      # Verify the committed lockfile is consistent (fails on drift) instead
      # of an unpinned `npm install`. The image itself is built reproducibly
      # from the lockfile inside the Dockerfile.
      - name: Install dependencies (lockfile-verified)
        run: yarn install --frozen-lockfile

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/cbpl-solar-main-web:latest .

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Push image to Docker Hub
        run: docker push ${{ secrets.DOCKER_USERNAME }}/cbpl-solar-main-web:latest

      - name: ✅ Done
        run: echo "Image pushed to Docker Hub!"

      - name: Deploy to Hostinger via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          # host: ${{ secrets.EC2_HOST }}
          # username: ${{ secrets.EC2_USER }}
          # key: ${{ secrets.EC2_SSH_KEY }}
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          script: |
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/cbpl-solar-main-web:latest
            sudo docker stop cbpl_solar_main_web || true && sudo docker rm cbpl_solar_main_web || true
            sudo docker run -d \
              --name cbpl_solar_main_web \
              --restart unless-stopped \
              -p 5001:3000 \
              --user 1001:1001 \
              --read-only \
              --tmpfs /tmp:rw,noexec,nosuid,size=64m \
              --tmpfs /app/.next/cache:rw,noexec,nosuid,size=256m \
              --cap-drop ALL \
              --security-opt no-new-privileges \
              --pids-limit 256 \
              --memory 512m \
              --cpus 1 \
              -e NEXT_PUBLIC_BASEURL=${{ secrets.NEXT_PUBLIC_BASEURL }} \
              -e NEXT_PUBLIC_SOCKET_URL=${{ secrets.NEXT_PUBLIC_SOCKET_URL }} \
              ${{ secrets.DOCKER_USERNAME }}/cbpl-solar-main-web:latest
